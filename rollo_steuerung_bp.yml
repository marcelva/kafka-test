blueprint:
  name: "Sommer Rollos (Multi) – Sonne + Temperatur + Override"
  description: >
    Steuert mehrere Rollos basierend auf Sonnensensor und Temperaturen.

  domain: automation

  input:
    covers:
      name: Rollos
      selector:
        target:
          entity:
            domain: cover

    enable:
      name: Automatik EIN/AUS
      selector:
        entity:
          domain: input_boolean

    sun_sensor:
      name: Sonnensensor
      selector:
        entity:
          domain: binary_sensor

    temp_inside:
      name: Innentemperatur
      selector:
        entity:
          domain: sensor

    temp_outside:
      name: Außentemperatur
      selector:
        entity:
          domain: sensor

    temp_in_on:
      default: 22
      selector:
        number:
          min: 10
          max: 35
          step: 0.5

    temp_in_off:
      default: 21
      selector:
        number:
          min: 10
          max: 35
          step: 0.5

    temp_out_on:
      default: 18
      selector:
        number:
          min: 0
          max: 40
          step: 0.5

    temp_out_off:
      default: 17
      selector:
        number:
          min: 0
          max: 40
          step: 0.5

    shading_position:
      default: 30
      selector:
        number:
          min: 0
          max: 100

    open_position:
      default: 100
      selector:
        number:
          min: 0
          max: 100

trigger:
  - platform: state
    entity_id: !input sun_sensor
  - platform: state
    entity_id: !input temp_inside
  - platform: state
    entity_id: !input temp_outside
  - platform: state
    entity_id: !input enable

condition:
  - condition: state
    entity_id: !input enable
    state: "on"

action:
  # 👉 HIER ist der Fix
  - variables:
      sun_entity: !input sun_sensor
      temp_in_entity: !input temp_inside
      temp_out_entity: !input temp_outside

      sun: "{{ is_state(sun_entity, 'on') }}"
      tin: "{{ states(temp_in_entity) | float(0) }}"
      tout: "{{ states(temp_out_entity) | float(0) }}"

  - choose:

      # 🌞 RUNTER
      - conditions:
          - condition: template
            value_template: >
              {{ sun and tin > !input temp_in_on and tout > !input temp_out_on }}
        sequence:
          - service: cover.set_cover_position
            target: !input covers
            data:
              position: !input shading_position

      # 🌥️ HOCH
      - conditions:
          - condition: template
            value_template: >
              {{ not sun or tin < !input temp_in_off or tout < !input temp_out_off }}
        sequence:
          - service: cover.set_cover_position
            target: !input covers
            data:
              position: !input open_position

mode: restart