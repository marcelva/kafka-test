blueprint:
  name: "Sommer Rollos (Multi) – sauber & stabil"
  description: >
    Mehrere Rollos mit Sonnensensor + Innen/Außen Temperatur.
    Einfach, stabil und ohne Template-Fehler.

  domain: automation

  input:
    covers:
      name: Rollos
      selector:
        target:
          entity:
            domain: cover

    enable:
      name: Automatik EIN/AUS
      selector:
        entity:
          domain: input_boolean

    sun_sensor:
      name: Sonnensensor
      selector:
        entity:
          domain: binary_sensor

    temp_inside:
      name: Innentemperatur
      selector:
        entity:
          domain: sensor

    temp_outside:
      name: Außentemperatur
      selector:
        entity:
          domain: sensor

    temp_in_on:
      default: 22
      selector:
        number:
          min: 10
          max: 35
          step: 0.5

    temp_in_off:
      default: 21
      selector:
        number:
          min: 10
          max: 35
          step: 0.5

    temp_out_on:
      default: 18
      selector:
        number:
          min: 0
          max: 40
          step: 0.5

    temp_out_off:
      default: 17
      selector:
        number:
          min: 0
          max: 40
          step: 0.5

    shading_position:
      default: 30
      selector:
        number:
          min: 0
          max: 100

    open_position:
      default: 100
      selector:
        number:
          min: 0
          max: 100

trigger:
  - platform: state
    entity_id: !input sun_sensor
  - platform: state
    entity_id: !input temp_inside
  - platform: state
    entity_id: !input temp_outside
  - platform: state
    entity_id: !input enable

condition:
  - condition: state
    entity_id: !input enable
    state: "on"

action:
  - variables:
      sun_entity: !input sun_sensor
      tin_entity: !input temp_inside
      tout_entity: !input temp_outside

      temp_in_on: !input temp_in_on
      temp_in_off: !input temp_in_off
      temp_out_on: !input temp_out_on
      temp_out_off: !input temp_out_off

      shading_position: !input shading_position
      open_position: !input open_position

      sun: "{{ is_state(sun_entity, 'on') }}"
      tin: "{{ states(tin_entity) | float(0) }}"
      tout: "{{ states(tout_entity) | float(0) }}"

  - choose:

      # 🌞 RUNTER
      - conditions:
          - condition: template
            value_template: >
              {{ sun and tin > temp_in_on and tout > temp_out_on }}
        sequence:
          - service: cover.set_cover_position
            target: !input covers
            data:
              position: "{{ shading_position }}"

      # 🌥️ HOCH
      - conditions:
          - condition: template
            value_template: >
              {{ not sun or tin < temp_in_off or tout < temp_out_off }}
        sequence:
          - service: cover.set_cover_position
            target: !input covers
            data:
              position: "{{ open_position }}"

mode: restart