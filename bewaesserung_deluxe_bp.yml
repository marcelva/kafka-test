                                Wolken: {{ current_clouds if current_clouds is not none else 'n/a' }}%.
                                Entscheidung: {{ 'übersprungen' if skip_due_to_weather else 'Bewässerung startet' }}.
                          - choose:
                              - conditions:
                                  - condition: template
