blueprint:
  name: Rasenbewässerung mit Wettercheck, iPhone-Info und Sonnen-Trigger
  description: >
    Startet eine Rasenbewässerung zu einer festen Uhrzeit oder relativ zu
    Sonnenaufgang/Sonnenuntergang. Optional wird vor dem Start eine
    Wettervorhersage geprüft. Danach erhält das iPhone eine Meldung mit dem
    berechneten Regenwert – unabhängig davon, ob die Bewässerung läuft oder
    übersprungen wird.
  domain: automation

  input:
    watering_switch:
      name: Schaltgerät für Wasser
      description: Schaltet die Bewässerung ein und aus.
      selector:
        entity:
          domain: switch

    use_fixed_time:
      name: Feste Uhrzeit verwenden
      description: Aktivieren, wenn die Bewässerung zu einer festen Uhrzeit starten soll.
      default: true
      selector:
        boolean:

    watering_time:
      name: Feste Startzeit
      description: Wird verwendet, wenn 'Feste Uhrzeit verwenden' aktiv ist.
      selector:
        time:

    use_sun_schedule:
      name: Sonnenaufgang/Sonnenuntergang verwenden
      description: Aktivieren, wenn der Start an Sonnenereignisse gekoppelt werden soll.
      default: false
      selector:
        boolean:

    sun_event:
      name: Sonnenereignis
      description: Sonnenaufgang oder Sonnenuntergang.
      default: sunrise
      selector:
        select:
          options:
            - sunrise
            - sunset

    sun_offset:
      name: Offset zum Sonnenereignis
      description: >
        Offset im Format HH:MM:SS. Negativ für vorher, positiv für nachher.
        Beispiel: -01:00:00 = eine Stunde vor Sonnenaufgang.
      default: '-01:00:00'
      selector:
        text:

    watering_duration_minutes:
      name: Laufzeit in Minuten
      description: Wie lange das Wasser eingeschaltet bleibt.
      default: 20
      selector:
        number:
          min: 1
          max: 180
          step: 1
          unit_of_measurement: min
          mode: slider

    lawn_name:
      name: Name der Bewässerung
      description: Wird in Benachrichtigungen angezeigt.
      default: Rasen
      selector:
        text:

    use_weather_check:
      name: Wetterprüfung aktivieren
      description: Vor dem Start anhand der Forecast-Daten prüfen.
      default: false
      selector:
        boolean:

    weather_entity:
      name: Wetter-Entität
      description: Wetter-Entity für die Niederschlagsprüfung.
      default: ''
      selector:
        entity:
          domain: weather

    forecast_lookahead_hours:
      name: Forecast-Zeitraum
      description: Wie viele Stunden in die Zukunft geprüft wird.
      default: 6
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: h
          mode: slider

    rain_probability_threshold:
      name: Niederschlagswahrscheinlichkeit
      description: Ab diesem Prozentwert wird die Bewässerung übersprungen.
      default: 50
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: '%'
          mode: slider

    rain_amount_threshold:
      name: Niederschlagsmenge
      description: Ab diesem mm-Wert wird die Bewässerung übersprungen.
      default: 0.2
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: mm
          mode: slider

    notify_targets:
      name: Benachrichtigung an
      description: Optional mehrere Notify-Entitäten auswählen, z. B. das iPhone.
      default: []
      selector:
        entity:
          domain: notify
          multiple: true

mode: single

variables:
  watering_switch: !input watering_switch
  use_fixed_time: !input use_fixed_time
  watering_time: !input watering_time
  use_sun_schedule: !input use_sun_schedule
  sun_event: !input sun_event
  sun_offset: !input sun_offset
  watering_duration_minutes: !input watering_duration_minutes
  lawn_name: !input lawn_name
  use_weather_check: !input use_weather_check
  weather_entity: !input weather_entity
  forecast_lookahead_hours: !input forecast_lookahead_hours
  rain_probability_threshold: !input rain_probability_threshold
  rain_amount_threshold: !input rain_amount_threshold
  notify_targets: !input notify_targets
  has_notifications: "{{ notify_targets | default([]) | length > 0 }}"

triggers:
  - trigger: time
    at: !input watering_time
    enabled: !input use_fixed_time

  - trigger: sun
    event: !input sun_event
    offset: !input sun_offset
    enabled: !input use_sun_schedule

actions:
  - if:
      - condition: template
        value_template: "{{ use_weather_check and weather_entity }}"
    then:
      - action: weather.get_forecasts
        target:
          entity_id: !input weather_entity
        data:
          type: hourly
        response_variable: weather_forecast

      - if:
          - condition: template
            value_template: >
              {% set forecast_data = weather_forecast[weather_entity].forecast if weather_forecast is defined and weather_entity in weather_forecast else [] %}
              {% set ns = namespace(skip=false, max_probability=0, max_amount=0, total_amount=0) %}
              {% for item in forecast_data[:forecast_lookahead_hours | int] %}
                {% set probability = item.precipitation_probability | default(0) | float(0) %}
                {% set amount = item.precipitation | default(0) | float(0) %}
                {% set ns.max_probability = [ns.max_probability, probability] | max %}
                {% set ns.max_amount = [ns.max_amount, amount] | max %}
                {% set ns.total_amount = ns.total_amount + amount %}
                {% if probability >= (rain_probability_threshold | float(0)) or amount >= (rain_amount_threshold | float(0)) %}
                  {% set ns.skip = true %}
                {% endif %}
              {% endfor %}
              {{ not ns.skip }}
        then:
          - if:
              - condition: template
                value_template: "{{ has_notifications }}"
            then:
              - action: notify.send_message
                data:
                  entity_id: !input notify_targets
                  title: "{{ lawn_name }}"
                  message: >
                    {% set forecast_data = weather_forecast[weather_entity].forecast if weather_forecast is defined and weather_entity in weather_forecast else [] %}
                    {% set ns = namespace(skip=false, max_probability=0, max_amount=0, total_amount=0) %}
                    {% for item in forecast_data[:forecast_lookahead_hours | int] %}
                      {% set probability = item.precipitation_probability | default(0) | float(0) %}
                      {% set amount = item.precipitation | default(0) | float(0) %}
                      {% set ns.max_probability = [ns.max_probability, probability] | max %}
                      {% set ns.max_amount = [ns.max_amount, amount] | max %}
                      {% set ns.total_amount = ns.total_amount + amount %}
                      {% if probability >= (rain_probability_threshold | float(0)) or amount >= (rain_amount_threshold | float(0)) %}
                        {% set ns.skip = true %}
                      {% endif %}
                    {% endfor %}
                    🌧️ {{ lawn_name }}: geprüft für die nächsten {{ forecast_lookahead_hours }} h.
                    Max. Regenwahrscheinlichkeit {{ ns.max_probability | round(0) }} %,
                    max. Regenmenge {{ ns.max_amount | round(1) }} mm/h,
                    Summe {{ ns.total_amount | round(1) }} mm.
                    Bewässerung wird gestartet.

          - if:
              - condition: template
                value_template: "{{ has_notifications }}"
            then:
              - action: notify.send_message
                data:
                  entity_id: !input notify_targets
                  title: "{{ lawn_name }}"
                  message: >
                    {{ lawn_name }} startet jetzt für {{ watering_duration_minutes }} Minuten.

          - action: switch.turn_on
            target:
              entity_id: !input watering_switch

          - delay:
              minutes: !input watering_duration_minutes

          - action: switch.turn_off
            target:
              entity_id: !input watering_switch

          - if:
              - condition: template
                value_template: "{{ has_notifications }}"
            then:
              - action: notify.send_message
                data:
                  entity_id: !input notify_targets
                  title: "{{ lawn_name }}"
                  message: >
                    ✅ {{ lawn_name }} ist fertig. Bewässerung beendet.
        else:
          - if:
              - condition: template
                value_template: "{{ has_notifications }}"
            then:
              - action: notify.send_message
                data:
                  entity_id: !input notify_targets
                  title: "{{ lawn_name }}"
                  message: >
                    {% set forecast_data = weather_forecast[weather_entity].forecast if weather_forecast is defined and weather_entity in weather_forecast else [] %}
                    {% set ns = namespace(skip=false, max_probability=0, max_amount=0, total_amount=0) %}
                    {% for item in forecast_data[:forecast_lookahead_hours | int] %}
                      {% set probability = item.precipitation_probability | default(0) | float(0) %}
                      {% set amount = item.precipitation | default(0) | float(0) %}
                      {% set ns.max_probability = [ns.max_probability, probability] | max %}
                      {% set ns.max_amount = [ns.max_amount, amount] | max %}
                      {% set ns.total_amount = ns.total_amount + amount %}
                      {% if probability >= (rain_probability_threshold | float(0)) or amount >= (rain_amount_threshold | float(0)) %}
                        {% set ns.skip = true %}
                      {% endif %}
                    {% endfor %}
                    🌧️ {{ lawn_name }}: geprüft für die nächsten {{ forecast_lookahead_hours }} h.
                    Max. Regenwahrscheinlichkeit {{ ns.max_probability | round(0) }} %,
                    max. Regenmenge {{ ns.max_amount | round(1) }} mm/h,
                    Summe {{ ns.total_amount | round(1) }} mm.
                    Bewässerung wird übersprungen.
    else:
      - if:
          - condition: template
            value_template: "{{ has_notifications }}"
        then:
          - action: notify.send_message
            data:
              entity_id: !input notify_targets
              title: "{{ lawn_name }}"
              message: >
                {{ lawn_name }} startet ohne Wetterprüfung für {{ watering_duration_minutes }} Minuten.

      - action: switch.turn_on
        target:
          entity_id: !input watering_switch

      - delay:
          minutes: !input watering_duration_minutes

      - action: switch.turn_off
        target:
          entity_id: !input watering_switch

      - if:
          - condition: template
            value_template: "{{ has_notifications }}"
        then:
          - action: notify.send_message
            data:
              entity_id: !input notify_targets
              title: "{{ lawn_name }}"
              message: >
                    ✅ {{ lawn_name }} ist fertig. Bewässerung beendet.
