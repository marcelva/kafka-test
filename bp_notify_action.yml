blueprint:
  name: Rollo mit iPhone Bestätigung (erweitert & stabil)
  description: >
    Führt eine auswählbare Aktion (z.B. Rollo öffnen/schließen/stoppen oder Szene/Skript)
    zu einer festen Uhrzeit aus – aber nur nach Bestätigung per iPhone (Actionable Notification).
    Enthält Debug-Logging und ist robust aufgebaut.

  domain: automation

  input:
    mobile_app_device:
      name: iPhone (Mobile App Gerät)
      selector:
        device:
          integration: mobile_app

    action_mode:
      name: Aktionstyp
      description: Welche Art von Aktion soll ausgeführt werden
      selector:
        select:
          options:
            - cover
            - scene
            - script
            - custom_service
      default: cover

    cover_entity:
      name: Rollo / Cover
      selector:
        entity:
          domain: cover

    cover_action:
      name: Cover Aktion
      selector:
        select:
          options:
            - open
            - close
            - stop
      default: close

    scene_entity:
      name: Szene
      default: ""
      selector:
        entity:
          domain: scene

    script_entity:
      name: Skript
      default: ""
      selector:
        entity:
          domain: script

    custom_service:
      name: Eigener Service (z.B. light.turn_on)
      default: ""
      selector:
        text:

    time_trigger:
      name: Uhrzeit
      selector:
        time:
      default: "19:00:00"

    weekdays:
      name: Wochentage
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun

    timeout:
      name: Bestätigungs-Timeout
      selector:
        duration:
      default:
        minutes: 2

    debug:
      name: Debug Logging
      selector:
        boolean:
      default: true


mode: restart


trigger:
  - platform: time
    at: !input time_trigger


condition:
  - condition: time
    weekday: !input weekdays


variables:
  device_id: !input mobile_app_device
  mode_selected: !input action_mode
  cover: !input cover_entity
  cover_action: !input cover_action
  scene: !input scene_entity
  script: !input script_entity
  custom_service: !input custom_service
  timeout: !input timeout
  debug: !input debug

  tag: "{{ 'rollo_' ~ context.id }}"
  action_confirm: "{{ 'CONFIRM_' ~ context.id }}"
  action_abort: "{{ 'ABORT_' ~ context.id }}"

  timeout_seconds: >-
    {% set d = timeout.get('days', 0) | int %}
    {% set h = timeout.get('hours', 0) | int %}
    {% set m = timeout.get('minutes', 0) | int %}
    {% set s = timeout.get('seconds', 0) | int %}
    {{ d * 86400 + h * 3600 + m * 60 + s }}


action:

  # Start Logging
  - if:
      - condition: template
        value_template: "{{ debug }}"
    then:
      - service: logbook.log
        data:
          name: Blueprint Aktion
          message: "Zeittrigger ausgelöst"
          entity_id: !input cover_entity

  # Notification
  - device_id: !input mobile_app_device
    domain: mobile_app
    type: notify
    title: "Aktion bestätigen"
    message: "Soll die konfigurierte Aktion ausgeführt werden?"
    data:
      tag: "{{ tag }}"
      actions:
        - action: "{{ action_confirm }}"
          title: "Ja"
        - action: "{{ action_abort }}"
          title: "Nein"

  # Warten
  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_confirm }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_abort }}"
    timeout: !input timeout

  # Entscheidung
  - choose:

      # BESTÄTIGT
      - conditions:
          - condition: template
            value_template: "{{ wait.completed and wait.trigger.event.data.action == action_confirm }}"
        sequence:

          - if:
              - condition: template
                value_template: "{{ debug }}"
            then:
              - service: logbook.log
                data:
                  name: Blueprint Aktion
                  message: "Bestätigt – führe Aktion aus"

          - choose:

              # COVER
              - conditions:
                  - condition: template
                    value_template: "{{ mode_selected == 'cover' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ cover_action == 'open' }}"
                        sequence:
                          - service: cover.open_cover
                            target:
                              entity_id: !input cover_entity
                      - conditions:
                          - condition: template
                            value_template: "{{ cover_action == 'stop' }}"
                        sequence:
                          - service: cover.stop_cover
                            target:
                              entity_id: !input cover_entity
                    default:
                      - service: cover.close_cover
                        target:
                          entity_id: !input cover_entity

              # SCENE
              - conditions:
                  - condition: template
                    value_template: "{{ mode_selected == 'scene' and scene != '' }}"
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: !input scene_entity

              # SCRIPT
              - conditions:
                  - condition: template
                    value_template: "{{ mode_selected == 'script' and script != '' }}"
                sequence:
                  - service: script.turn_on
                    target:
                      entity_id: !input script_entity

              # CUSTOM SERVICE
              - conditions:
                  - condition: template
                    value_template: "{{ mode_selected == 'custom_service' and custom_service != '' }}"
                sequence:
                  - service: "{{ custom_service }}"

      # ABGEBROCHEN
      - conditions:
          - condition: template
            value_template: "{{ wait.completed and wait.trigger.event.data.action == action_abort }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ debug }}"
            then:
              - service: logbook.log
                data:
                  name: Blueprint Aktion
                  message: "Abgebrochen"

      # TIMEOUT
      - conditions:
          - condition: template
            value_template: "{{ not wait.completed }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ debug }}"
            then:
              - service: logbook.log
                data:
                  name: Blueprint Aktion
                  message: "Timeout – keine Antwort"

  # Notification entfernen
  - device_id: !input mobile_app_device
    domain: mobile_app
    type: notify
    message: clear_notification
    data:
      tag: "{{ tag }}"