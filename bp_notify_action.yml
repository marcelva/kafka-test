blueprint:
  name: Rollo mit iPhone Bestätigung (FINAL stabil)
  description: >
    Führt eine Aktion (Cover / Szene / Script / Service) nur nach iPhone-Bestätigung aus.
    Ausgelöst durch festen Zeittrigger.

  domain: automation

  input:
    mobile_app_device:
      name: iPhone Gerät
      selector:
        device:
          integration: mobile_app

    action_mode:
      name: Aktionstyp
      selector:
        select:
          options:
            - cover
            - scene
            - script
            - service
      default: cover

    cover_entity:
      name: Rollo / Cover
      default: ""
      selector:
        entity:
          domain: cover

    cover_action:
      name: Cover Aktion
      selector:
        select:
          options:
            - open
            - close
            - stop
      default: close

    scene_entity:
      name: Szene
      default: ""
      selector:
        entity:
          domain: scene

    script_entity:
      name: Script
      default: ""
      selector:
        entity:
          domain: script

    service_name:
      name: Service (z.B. light.turn_on)
      default: ""
      selector:
        text:

    trigger_time:
      name: Uhrzeit
      selector:
        time:
      default: "19:00:00"

    weekdays:
      name: Wochentage
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun

    timeout:
      name: Timeout
      selector:
        duration:
      default:
        minutes: 2

    debug:
      name: Debug Logging
      selector:
        boolean:
      default: true


mode: restart


trigger:
  - platform: time
    at: !input trigger_time


condition:
  - condition: time
    weekday: !input weekdays


variables:
  mode_selected: !input action_mode
  cover_entity: !input cover_entity
  cover_action: !input cover_action
  scene_entity: !input scene_entity
  script_entity: !input script_entity
  service_name: !input service_name
  debug: !input debug

  tag: "{{ 'rollo_' ~ context.id }}"
  confirm: "{{ 'CONFIRM_' ~ context.id }}"
  abort: "{{ 'ABORT_' ~ context.id }}"


action:

  # Debug Start
  - if:
      - condition: template
        value_template: "{{ debug }}"
    then:
      - service: logbook.log
        data:
          name: Blueprint
          message: "Trigger ausgelöst"

  # Notification
  - device_id: !input mobile_app_device
    domain: mobile_app
    type: notify
    title: "Aktion bestätigen"
    message: "Aktion ausführen?"
    data:
      tag: "{{ tag }}"
      actions:
        - action: "{{ confirm }}"
          title: "Ja"
        - action: "{{ abort }}"
          title: "Nein"

  # Wait
  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ confirm }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ abort }}"
    timeout: !input timeout

  # Entscheidung
  - choose:

      # BESTÄTIGT
      - conditions:
          - condition: template
            value_template: "{{ wait.completed and wait.trigger.event.data.action == confirm }}"
        sequence:

          - if:
              - condition: template
                value_template: "{{ debug }}"
            then:
              - service: logbook.log
                data:
                  name: Blueprint
                  message: "Bestätigt"

          - choose:

              # COVER
              - conditions:
                  - condition: template
                    value_template: "{{ mode_selected == 'cover' and cover_entity != '' }}"
                sequence:
                  - service: >
                      {% if cover_action == 'open' %}
                        cover.open_cover
                      {% elif cover_action == 'stop' %}
                        cover.stop_cover
                      {% else %}
                        cover.close_cover
                      {% endif %}
                    target:
                      entity_id: !input cover_entity

              # SCENE
              - conditions:
                  - condition: template
                    value_template: "{{ mode_selected == 'scene' and scene_entity != '' }}"
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: !input scene_entity

              # SCRIPT
              - conditions:
                  - condition: template
                    value_template: "{{ mode_selected == 'script' and script_entity != '' }}"
                sequence:
                  - service: script.turn_on
                    target:
                      entity_id: !input script_entity

              # SERVICE
              - conditions:
                  - condition: template
                    value_template: "{{ mode_selected == 'service' and service_name != '' }}"
                sequence:
                  - service: "{{ service_name }}"

      # ABBRUCH
      - conditions:
          - condition: template
            value_template: "{{ wait.completed and wait.trigger.event.data.action == abort }}"
        sequence:
          - service: logbook.log
            data:
              name: Blueprint
              message: "Abgebrochen"

      # TIMEOUT
      - conditions:
          - condition: template
            value_template: "{{ not wait.completed }}"
        sequence:
          - service: logbook.log
            data:
              name: Blueprint
              message: "Timeout"

  # Notification entfernen
  - device_id: !input mobile_app_device
    domain: mobile_app
    type: notify
    message: clear_notification
    data:
      tag: "{{ tag }}"