blueprint:
  name: Rollo mit iPhone-Bestätigung
  description: Rollo fährt nur nach Bestätigung per iPhone-Benachrichtigung.
  domain: automation

  input:
    mobile_app_device:
      name: iPhone (Mobile App Gerät)
      description: iPhone in der Home-Assistant-Mobile-App auswählen
      selector:
        device:
          integration: mobile_app

    cover_entity:
      name: Rollo / Cover
      selector:
        entity:
          domain: cover

    cover_action:
      name: Rollo-Aktion
      description: Aktion, die nach Bestätigung ausgeführt wird
      selector:
        select:
          options:
            - open
            - close
      default: close

    fixed_time:
      name: Feste Uhrzeit
      selector:
        time:
      default: "19:00:00"

    confirmation_timeout:
      name: Bestätigungs-Timeout
      selector:
        duration:
      default:
        minutes: 2

    debug_logging:
      name: Debug-Logging aktiv
      selector:
        boolean:
      default: true

mode: single
max_exceeded: silent

variables:
  debug_logging: !input debug_logging
  cover_action: !input cover_action
  timeout_seconds: >-
    {% set d = confirmation_timeout.get('days', 0) | int %}
    {% set h = confirmation_timeout.get('hours', 0) | int %}
    {% set m = confirmation_timeout.get('minutes', 0) | int %}
    {% set s = confirmation_timeout.get('seconds', 0) | int %}
    {{ d * 86400 + h * 3600 + m * 60 + s }}
  notification_tag: "{{ 'rollo_confirm_' ~ context.id }}"
  confirm_action: "{{ 'ROLL_CONFIRM_' ~ context.id }}"
  abort_action: "{{ 'ROLL_ABORT_' ~ context.id }}"

trigger:
  - platform: time
    at: !input fixed_time
    id: fixed_time

action:
  - if:
      - condition: template
        value_template: "{{ debug_logging }}"
    then:
      - action: logbook.log
        data:
          name: Rollo-Bestätigung
          message: "Trigger ausgelöst: fester Zeittrigger."
          entity_id: !input cover_entity

  - device_id: !input mobile_app_device
    domain: mobile_app
    type: notify
    title: Rollo bestätigen
    message: >-
      Das Rollo soll jetzt fahren.
      Bitte innerhalb von {{ timeout_seconds }} Sekunden bestätigen.
    data:
      tag: "{{ notification_tag }}"
      actions:
        - action: "{{ confirm_action }}"
          title: Bestätigen
        - action: "{{ abort_action }}"
          title: Abbrechen

  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ confirm_action }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ abort_action }}"
    timeout: !input confirmation_timeout

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ wait.completed and wait.trigger.event.data.action == confirm_action }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ debug_logging }}"
            then:
              - action: logbook.log
                data:
                  name: Rollo-Bestätigung
                  message: "Bestätigt per iPhone. Rollo wird gefahren."
                  entity_id: !input cover_entity

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ cover_action == 'open' }}"
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: !input cover_entity
            default:
              - action: cover.close_cover
                target:
                  entity_id: !input cover_entity

          - action: mobile_app.notify
            data:
              message: clear_notification
              target:
                device_id: !input mobile_app_device
              data:
                tag: "{{ notification_tag }}"

          - if:
              - condition: template
                value_template: "{{ debug_logging }}"
            then:
              - action: logbook.log
                data:
                  name: Rollo-Bestätigung
                  message: "Notification entfernt nach Bestätigung."
                  entity_id: !input cover_entity

      - conditions:
          - condition: template
            value_template: "{{ wait.completed and wait.trigger.event.data.action == abort_action }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ debug_logging }}"
            then:
              - action: logbook.log
                data:
                  name: Rollo-Bestätigung
                  message: "Abgebrochen per iPhone. Rollo bleibt unverändert."
                  entity_id: !input cover_entity

          - action: mobile_app.notify
            data:
              message: clear_notification
              target:
                device_id: !input mobile_app_device
              data:
                tag: "{{ notification_tag }}"

      - conditions:
          - condition: template
            value_template: "{{ not wait.completed }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ debug_logging }}"
            then:
              - action: logbook.log
                data:
                  name: Rollo-Bestätigung
                  message: "Timeout abgelaufen. Rollo bleibt unverändert."
                  entity_id: !input cover_entity

          - action: mobile_app.notify
            data:
              message: clear_notification
              target:
                device_id: !input mobile_app_device
              data:
                tag: "{{ notification_tag }}"