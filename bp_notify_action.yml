blueprint:
  name: "Bestätigtes Rollo per iPhone – Zeit & Ladezustand"
  description: >
    Sendet eine Bestätigungs-Benachrichtigung an ein iPhone via Home Assistant Companion App.
    Auslösen kann die Automation entweder zu einer festen Zeit oder beim An-/Abstecken des Ladegeräts.
    Optional kann der Ladezustand nur innerhalb eines Zeitfensters berücksichtigt werden.
  domain: automation
  homeassistant:
    min_version: "2024.6.0"
  input:
    cover_entity:
      name: Rollo / Cover
      description: Das zu steuernde Rollo.
      selector:
        entity:
          domain: cover

    notify_device:
      name: iPhone für die Bestätigung
      description: Wähle dein iPhone aus. Der passende notify.mobile_app_-Dienst wird daraus abgeleitet.
      selector:
        device:
          filter:
            - manufacturer: Apple

    trigger_time:
      name: Feste Uhrzeit
      description: Uhrzeit für den täglichen Trigger.
      selector:
        time:

    battery_state_sensor:
      name: iPhone-Ladesensor
      description: sensor.battery_state des iPhones aus der Home Assistant Companion App.
      selector:
        entity:
          domain: sensor

    use_charging_window:
      name: Ladezustand nur in Zeitfenster berücksichtigen
      default: false
      selector:
        boolean:

    charging_window_start:
      name: Zeitfenster Beginn
      default: "21:00:00"
      selector:
        time:

    charging_window_end:
      name: Zeitfenster Ende
      default: "23:00:00"
      selector:
        time:

    only_if_open:
      name: Nur ausführen, wenn das Rollo offen ist
      default: true
      selector:
        boolean:

    confirm_timeout:
      name: Bestätigungsfenster
      description: Wie lange auf die Bestätigung gewartet wird.
      default:
        minutes: 2
      selector:
        duration:
          enable_second: true

    notification_title:
      name: Titel
      default: "Rollo schließen?"
      selector:
        text:

    notification_message:
      name: Nachricht
      default: "Bitte innerhalb von 120 Sekunden bestätigen, sonst bleibt das Rollo offen."
      selector:
        text:

    confirm_button_text:
      name: Bestätigen-Button
      default: "Rollo schließen"
      selector:
        text:

    cancel_button_text:
      name: Abbrechen-Button
      default: "Offen lassen"
      selector:
        text:

    require_unlock_on_confirm:
      name: Bestätigung nur mit Gerätefreigabe
      default: false
      selector:
        boolean:

mode: single
max_exceeded: silent

triggers:
  - trigger: time
    at: !input trigger_time
    id: scheduled

  - trigger: state
    entity_id: !input battery_state_sensor
    to: "Charging"
    id: charging_on

  - trigger: state
    entity_id: !input battery_state_sensor
    to: "Not Charging"
    id: charging_off

variables:
  cover_entity_id: !input cover_entity
  notify_device_id: !input notify_device
  only_if_open_input: !input only_if_open
  use_charging_window_input: !input use_charging_window
  charging_window_start_input: !input charging_window_start
  charging_window_end_input: !input charging_window_end
  allow_charging_trigger: >-
    {{ not use_charging_window_input or
       (now().strftime('%H:%M:%S') >= charging_window_start_input and
        now().strftime('%H:%M:%S') < charging_window_end_input) }}
  notify_service_name: >-
    notify.mobile_app_{{ device_attr(notify_device_id, 'name') | slugify }}
  action_confirm: "{{ 'CONFIRM_ROLLO_' ~ context.id }}"
  action_cancel: "{{ 'CANCEL_ROLLO_' ~ context.id }}"
  notification_tag: "{{ 'rollo_confirm_' ~ context.id }}"

actions:
  - choose:
      - alias: Zeittrigger
        conditions:
          - condition: trigger
            id: scheduled
          - condition: template
            value_template: "{{ (not only_if_open_input) or is_state(cover_entity_id, 'open') }}"
        sequence:
          - action: "{{ notify_service_name }}"
            data:
              title: !input notification_title
              message: !input notification_message
              data:
                tag: "{{ notification_tag }}"
                actions:
                  - action: "{{ action_confirm }}"
                    title: !input confirm_button_text
                    authenticationRequired: !input require_unlock_on_confirm
                  - action: "{{ action_cancel }}"
                    title: !input cancel_button_text
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_confirm }}"
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_cancel }}"
            timeout: !input confirm_timeout
            continue_on_timeout: true
          - choose:
              - conditions: "{{ wait.trigger is not none and wait.trigger.event.data.action == action_confirm }}"
                sequence:
                  - action: "{{ notify_service_name }}"
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ notification_tag }}"
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover_entity
              - conditions: "{{ wait.trigger is not none and wait.trigger.event.data.action == action_cancel }}"
                sequence:
                  - action: "{{ notify_service_name }}"
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ notification_tag }}"
            default:
              - action: "{{ notify_service_name }}"
                data:
                  message: clear_notification
                  data:
                    tag: "{{ notification_tag }}"

      - alias: Ladezustand
        conditions:
          - condition: trigger
            id:
              - charging_on
              - charging_off
          - condition: template
            value_template: "{{ allow_charging_trigger and ((not only_if_open_input) or is_state(cover_entity_id, 'open')) }}"
        sequence:
          - action: "{{ notify_service_name }}"
            data:
              title: !input notification_title
              message: !input notification_message
              data:
                tag: "{{ notification_tag }}"
                actions:
                  - action: "{{ action_confirm }}"
                    title: !input confirm_button_text
                    authenticationRequired: !input require_unlock_on_confirm
                  - action: "{{ action_cancel }}"
                    title: !input cancel_button_text
          - wait_for_trigger:
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_confirm }}"
              - trigger: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "{{ action_cancel }}"
            timeout: !input confirm_timeout
            continue_on_timeout: true
          - choose:
              - conditions: "{{ wait.trigger is not none and wait.trigger.event.data.action == action_confirm }}"
                sequence:
                  - action: "{{ notify_service_name }}"
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ notification_tag }}"
                  - action: cover.close_cover
                    target:
                      entity_id: !input cover_entity
              - conditions: "{{ wait.trigger is not none and wait.trigger.event.data.action == action_cancel }}"
                sequence:
                  - action: "{{ notify_service_name }}"
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ notification_tag }}"
            default:
              - action: "{{ notify_service_name }}"
                data:
                  message: clear_notification
                  data:
                    tag: "{{ notification_tag }}"
