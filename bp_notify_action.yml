blueprint:
  name: Rollo mit iPhone Bestätigung (robust)
  description: >
    Fährt ein Rollo erst nach Bestätigung per iPhone (Actionable Notification).
    Unterstützt optional:
    - festen Zeittrigger
    - Lade-Trigger (angesteckt)
    - optional: Kabel entfernt
    - optionales Zeitfenster NUR für Lade-Trigger

  domain: automation

  input:
    mobile_app_device:
      name: iPhone (Mobile App Gerät)
      description: Gerät aus der Home Assistant Mobile App auswählen
      selector:
        device:
          integration: mobile_app

    cover_entity:
      name: Rollo / Cover
      selector:
        entity:
          domain: cover

    cover_action:
      name: Rollo Aktion
      selector:
        select:
          options:
            - open
            - close
      default: close

    # Zeittrigger
    fixed_time_enabled:
      name: Zeittrigger aktiv
      selector:
        boolean:
      default: true

    fixed_time:
      name: Uhrzeit
      selector:
        time:
      default: "19:00:00"

    # Lade-Trigger
    charge_trigger_enabled:
      name: Lade-Trigger aktiv
      selector:
        boolean:
      default: false

    charge_sensor:
      name: iPhone Ladezustand Sensor
      description: battery_state Sensor (z.B. Charging / Not Charging)
      default: ""
      selector:
        entity:
          domain: sensor

    unplug_trigger_enabled:
      name: Trigger bei Kabel entfernt
      selector:
        boolean:
      default: false

    # Zeitfenster
    charge_window_enabled:
      name: Lade-Zeitfenster aktiv
      selector:
        boolean:
      default: false

    charge_window_start:
      name: Startzeit Fenster
      selector:
        time:
      default: "21:00:00"

    charge_window_end:
      name: Endzeit Fenster
      selector:
        time:
      default: "23:00:00"

    # Timeout
    confirmation_timeout:
      name: Bestätigungs-Timeout
      selector:
        duration:
      default:
        minutes: 2

    debug:
      name: Debug Logging
      selector:
        boolean:
      default: true


mode: restart


trigger_variables:
  charge_sensor: !input charge_sensor
  charge_enabled: !input charge_trigger_enabled
  unplug_enabled: !input unplug_trigger_enabled

trigger:
  - platform: time
    at: !input fixed_time
    id: time
    enabled: !input fixed_time_enabled

  - platform: state
    entity_id: "{{ charge_sensor }}"
    to:
      - "Charging"
      - "Full"
    id: charging
    enabled: "{{ charge_enabled and charge_sensor != '' }}"

  - platform: state
    entity_id: "{{ charge_sensor }}"
    to: "Not Charging"
    id: unplugged
    enabled: "{{ unplug_enabled and charge_sensor != '' }}"


variables:
  device_id: !input mobile_app_device
  cover: !input cover_entity
  action_type: !input cover_action
  timeout: !input confirmation_timeout
  debug: !input debug
  window_enabled: !input charge_window_enabled
  window_start: !input charge_window_start
  window_end: !input charge_window_end

  tag: "{{ 'rollo_' ~ context.id }}"
  action_confirm: "{{ 'CONFIRM_' ~ context.id }}"
  action_abort: "{{ 'ABORT_' ~ context.id }}"

  window_ok: >-
    {% if trigger.id != 'charging' or not window_enabled %}
      true
    {% else %}
      {% set s = today_at(window_start) %}
      {% set e = today_at(window_end) %}
      {% if s <= e %}
        {{ s <= now() <= e }}
      {% else %}
        {{ now() >= s or now() <= e }}
      {% endif %}
    {% endif %}


action:

  # Fenster prüfen
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'charging' and window_enabled and not (window_ok | bool) }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ debug }}"
            then:
              - service: system_log.write
                data:
                  level: info
                  message: "Abbruch: außerhalb Zeitfenster"
          - stop: "Außerhalb Zeitfenster"

  # Logging Start
  - if:
      - condition: template
        value_template: "{{ debug }}"
    then:
      - service: system_log.write
        data:
          level: info
          message: "Trigger: {{ trigger.id }}"

  # Notification senden (Device basiert → Dropdown!)
  - device_id: !input mobile_app_device
    domain: mobile_app
    type: notify
    title: "Rollo bestätigen"
    message: "Soll das Rollo fahren?"
    data:
      tag: "{{ tag }}"
      actions:
        - action: "{{ action_confirm }}"
          title: "Ja"
        - action: "{{ action_abort }}"
          title: "Nein"

  # Warten auf Antwort
  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_confirm }}"
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "{{ action_abort }}"
    timeout: !input confirmation_timeout

  # Auswertung
  - choose:

      # BESTÄTIGT
      - conditions:
          - condition: template
            value_template: "{{ wait.completed and wait.trigger.event.data.action == action_confirm }}"
        sequence:

          - if:
              - condition: template
                value_template: "{{ debug }}"
            then:
              - service: system_log.write
                data:
                  level: info
                  message: "Bestätigt → fahre Rollo"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ action_type == 'open' }}"
                sequence:
                  - service: cover.open_cover
                    target:
                      entity_id: !input cover_entity
            default:
              - service: cover.close_cover
                target:
                  entity_id: !input cover_entity

      # ABGEBROCHEN
      - conditions:
          - condition: template
            value_template: "{{ wait.completed and wait.trigger.event.data.action == action_abort }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ debug }}"
            then:
              - service: system_log.write
                data:
                  level: info
                  message: "Abgebrochen"

      # TIMEOUT
      - conditions:
          - condition: template
            value_template: "{{ not wait.completed }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ debug }}"
            then:
              - service: system_log.write
                data:
                  level: info
                  message: "Timeout – keine Antwort"

  # Notification entfernen
  - device_id: !input mobile_app_device
    domain: mobile_app
    type: notify
    message: clear_notification
    data:
      tag: "{{ tag }}"