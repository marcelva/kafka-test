blueprint:
  name: Rollo mit iPhone-Bestätigung
  description: Rollo fährt erst nach Bestätigung per iPhone. Unterstützt Zeit- oder Lade-Trigger.
  domain: automation
  author: OpenAI
  input:
    notify_service:
      name: iPhone Notify-Service
      selector:
        text:
    cover_entity:
      name: Rollo / Cover
      selector:
        entity:
          domain: cover
    cover_action:
      name: Rollo-Aktion
      selector:
        select:
          options:
            - open
            - close
      default: open
    fixed_time_enabled:
      name: Fester Zeittrigger aktiv
      selector:
        boolean:
      default: true
    fixed_time:
      name: Feste Uhrzeit
      selector:
        time:
      default: "19:00:00"
    charge_trigger_enabled:
      name: Lade-Trigger aktiv
      selector:
        boolean:
      default: false
    charge_sensor:
      name: iPhone-Ladesensor
      selector:
        entity:
          domain: sensor
    charge_window_enabled:
      name: Ladefenster aktiv
      selector:
        boolean:
      default: false
    charge_window_start:
      name: Ladefenster Start
      selector:
        time:
      default: "21:00:00"
    charge_window_end:
      name: Ladefenster Ende
      selector:
        time:
      default: "23:00:00"
    unplug_trigger_enabled:
      name: Trigger bei Kabel entfernt
      selector:
        boolean:
      default: false
    confirmation_timeout:
      name: Timeout
      selector:
        duration:
      default:
        minutes: 2
    debug_logging:
      name: Debug Logging
      selector:
        boolean:
      default: true

mode: parallel
max: 10

variables:
  notify_service: !input notify_service
  cover_action: !input cover_action
  charge_window_enabled: !input charge_window_enabled
  charge_window_start: !input charge_window_start
  charge_window_end: !input charge_window_end
  debug_logging: !input debug_logging

trigger:
  - platform: time
    id: time
    at: !input fixed_time
    enabled: !input fixed_time_enabled

  - platform: state
    id: charging
    entity_id: !input charge_sensor
    to:
      - "Charging"
      - "Full"
    enabled: !input charge_trigger_enabled

  - platform: state
    id: unplugged
    entity_id: !input charge_sensor
    to: "Not Charging"
    enabled: !input unplug_trigger_enabled

action:
  - variables:
      tag: "{{ 'rollo_' ~ context.id }}"
      action_confirm: "{{ 'CONFIRM_' ~ context.id }}"
      action_abort: "{{ 'ABORT_' ~ context.id }}"
      window_ok: >-
        {% if trigger.id != 'charging' or not charge_window_enabled %}
          true
        {% else %}
          {% set start = today_at(charge_window_start) %}
          {% set end = today_at(charge_window_end) %}
          {% if start <= end %}
            {{ start <= now() <= end }}
          {% else %}
            {{ now() >= start or now() <= end }}
          {% endif %}
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'charging' and charge_window_enabled and not (window_ok | bool) }}"
        sequence:
          - service: system_log.write
            data:
              message: "Trigger außerhalb Ladefenster – Abbruch"
              level: info

    default:
      - service: system_log.write
        data:
          message: "Trigger {{ trigger.id }} ausgelöst"
          level: info

      - service: "{{ notify_service }}"
        data:
          title: "Rollo bestätigen"
          message: "Soll das Rollo fahren?"
          data:
            tag: "{{ tag }}"
            actions:
              - action: "{{ action_confirm }}"
                title: "Ja"
              - action: "{{ action_abort }}"
                title: "Nein"

      - wait_for_trigger:
          - platform: event
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_confirm }}"
          - platform: event
            event_type: mobile_app_notification_action
            event_data:
              action: "{{ action_abort }}"
        timeout: !input confirmation_timeout

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ wait.completed and wait.trigger.event.data.action == action_confirm }}"
            sequence:
              - service: system_log.write
                data:
                  message: "Bestätigt – Rollo fährt"
                  level: info

              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ cover_action == 'open' }}"
                    sequence:
                      - service: cover.open_cover
                        target:
                          entity_id: !input cover_entity
                  - default:
                      - service: cover.close_cover
                        target:
                          entity_id: !input cover_entity

          - conditions:
              - condition: template
                value_template: "{{ wait.completed and wait.trigger.event.data.action == action_abort }}"
            sequence:
              - service: system_log.write
                data:
                  message: "Abgebrochen"
                  level: info

          - conditions:
              - condition: template
                value_template: "{{ not wait.completed }}"
            sequence:
              - service: system_log.write
                data:
                  message: "Timeout – keine Bestätigung"
                  level: info

      - service: "{{ notify_service }}"
        data:
          message: clear_notification
          data:
            tag: "{{ tag }}"